name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --fund=false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          # Dev-instance Clerk keys (pk_test_/sk_test_) — clerkSetup refuses a
          # live one. See docs/environments.md.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # A database dedicated to E2E runs, not the shared dev one — the
          # dev-only wipe routes these tests call clear it after every run.
          MONGODB_URI: ${{ secrets.E2E_MONGODB_URI }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # The app's invite gate (src/app/api/unlock/route.ts) — e2e/auth.setup.ts
          # uses it to unlock the test users the same way a real signup would.
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          E2E_PLAYER_ONE_EMAIL: ${{ secrets.E2E_PLAYER_ONE_EMAIL }}
          E2E_PLAYER_ONE_PASSWORD: ${{ secrets.E2E_PLAYER_ONE_PASSWORD }}
          E2E_PLAYER_TWO_EMAIL: ${{ secrets.E2E_PLAYER_TWO_EMAIL }}
          E2E_PLAYER_TWO_PASSWORD: ${{ secrets.E2E_PLAYER_TWO_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
