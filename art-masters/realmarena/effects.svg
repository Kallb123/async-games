<?xml version="1.0" encoding="UTF-8"?>
<!--
  Realm Arena's status effect marks (docs/games/realm-arena.md §20): one 96px
  badge a cell, left to right in `EFFECT_IDS` order — burning, stunned, slowed,
  marked, corroded, hunkered down, shield wall, and the Realm's (§34.2)
  poisoned, braced, blessed, focused and warded — then, after the effects, the
  watch a character banks AP on for overwatch or guard (`WATCH_ART`). Each is a coin with a dark rim, so it
  reads on grass, stone or a figure's own colour at a few pixels across, and
  one bold glyph in white.

  `npm run ra-marks` renders this to public/art/realmarena/effects.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="96" viewBox="0 0 1248 96">
  <defs>
    <radialGradient id="sheen" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </radialGradient>
    <g id="rim">
      <circle cx="48" cy="48" r="42" fill="url(#sheen)" stroke="#24150f" stroke-width="7"/>
    </g>
  </defs>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Burning: a flame. -->
    <g>
      <circle cx="48" cy="48" r="42" fill="#d4471f"/>
      <use href="#rim"/>
      <path d="M48 15 C57 30 72 37 68 58 C66 71 57 79 48 79 C37 79 28 71 28 58 C28 47 35 42 37 33 C42 41 44 44 46 47 C46 36 43 26 48 15 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
      <path d="M48 50 C54 57 59 62 57 69 C55 74 52 76 48 76 C43 76 39 72 39 67 C39 61 44 58 48 50 Z" fill="#f6b21c"/>
    </g>

    <!-- Stunned: a lightning bolt. -->
    <g transform="translate(96 0)">
      <circle cx="48" cy="48" r="42" fill="#d99a14"/>
      <use href="#rim"/>
      <path d="M55 13 L28 53 L45 53 L38 83 L68 41 L51 41 L60 13 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
    </g>

    <!-- Slowed: an hourglass, its sand run low. -->
    <g transform="translate(192 0)">
      <circle cx="48" cy="48" r="42" fill="#2f78c2"/>
      <use href="#rim"/>
      <path d="M30 19 H66 V26 C66 38 55 43 53 48 C55 53 66 58 66 70 V77 H30 V70 C30 58 41 53 43 48 C41 43 30 38 30 26 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
      <path d="M37 72 C38 64 45 61 48 58 C51 61 58 64 59 72 Z" fill="#2f78c2"/>
      <path d="M41 30 H55 C54 35 50 38 48 40 C46 38 42 35 41 30 Z" fill="#2f78c2"/>
    </g>

    <!-- Marked: a target's crosshair. -->
    <g transform="translate(288 0)">
      <circle cx="48" cy="48" r="42" fill="#b02634"/>
      <use href="#rim"/>
      <g fill="none" stroke="#24150f" stroke-width="13">
        <circle cx="48" cy="48" r="18"/>
        <path d="M48 16 V29 M48 67 V80 M16 48 H29 M67 48 H80"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="6">
        <circle cx="48" cy="48" r="18"/>
        <path d="M48 16 V29 M48 67 V80 M16 48 H29 M67 48 H80"/>
      </g>
      <circle cx="48" cy="48" r="5" fill="#fff" stroke="#24150f" stroke-width="3"/>
    </g>

    <!-- Corroded: a drop of acid eating into a plate. -->
    <g transform="translate(384 0)">
      <circle cx="48" cy="48" r="42" fill="#5c8a1e"/>
      <use href="#rim"/>
      <path d="M48 13 C55 26 66 36 66 50 C66 61 58 68 48 68 C38 68 30 61 30 50 C30 36 41 26 48 13 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
      <path d="M40 50 C40 56 44 60 49 60" fill="none" stroke="#9ad13a" stroke-width="5"/>
      <path d="M22 78 H36 L40 72 L46 79 L52 72 L57 78 H74" fill="none" stroke="#24150f" stroke-width="10"/>
      <path d="M22 78 H36 L40 72 L46 79 L52 72 L57 78 H74" fill="none" stroke="#fff" stroke-width="4"/>
    </g>

    <!-- Hunkered down: chevrons pressing down onto the ground. -->
    <g transform="translate(480 0)">
      <circle cx="48" cy="48" r="42" fill="#72662f"/>
      <use href="#rim"/>
      <g fill="none" stroke="#24150f" stroke-width="15">
        <path d="M29 24 L48 39 L67 24 M29 42 L48 57 L67 42 M26 72 H70"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="8">
        <path d="M29 24 L48 39 L67 24 M29 42 L48 57 L67 42 M26 72 H70"/>
      </g>
    </g>

    <!-- Shield wall: a heater shield. -->
    <g transform="translate(576 0)">
      <circle cx="48" cy="48" r="42" fill="#53677e"/>
      <use href="#rim"/>
      <path d="M48 16 L72 25 V45 C72 62 62 73 48 80 C34 73 24 62 24 45 V25 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
      <path d="M48 23 V73 M31 43 H65" fill="none" stroke="#53677e" stroke-width="6"/>
    </g>

    <!-- Poisoned: a skull. -->
    <g transform="translate(672 0)">
      <circle cx="48" cy="48" r="42" fill="#2e7d4f"/>
      <use href="#rim"/>
      <path d="M48 18 C32 18 22 29 22 43 C22 52 27 59 34 62 V74 H62 V62 C69 59 74 52 74 43 C74 29 64 18 48 18 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
      <circle cx="38" cy="44" r="7" fill="#2e7d4f" stroke="#24150f" stroke-width="3"/>
      <circle cx="58" cy="44" r="7" fill="#2e7d4f" stroke="#24150f" stroke-width="3"/>
      <path d="M48 53 L43 60 H53 Z" fill="#24150f"/>
      <path d="M42 66 V74 M48 66 V74 M54 66 V74" fill="none" stroke="#24150f" stroke-width="3"/>
    </g>

    <!-- Braced: a helm, its visor down, set on the ground. -->
    <g transform="translate(768 0)">
      <circle cx="48" cy="48" r="42" fill="#8a5a2b"/>
      <use href="#rim"/>
      <path d="M24 64 C24 38 34 20 48 20 C62 20 72 38 72 64 V70 H58 V58 H38 V70 H24 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
      <path d="M31 45 H65" fill="none" stroke="#24150f" stroke-width="7"/>
      <path d="M48 21 V38" fill="none" stroke="#8a5a2b" stroke-width="5"/>
      <path d="M20 78 H76" fill="none" stroke="#24150f" stroke-width="10"/>
      <path d="M20 78 H76" fill="none" stroke="#fff" stroke-width="4"/>
    </g>

    <!-- Blessed: a four-pointed star of light, two sparks beside it. -->
    <g transform="translate(864 0)">
      <circle cx="48" cy="48" r="42" fill="#c99418"/>
      <use href="#rim"/>
      <path d="M48 14 L55 41 L82 48 L55 55 L48 82 L41 55 L14 48 L41 41 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
      <circle cx="48" cy="48" r="6" fill="#c99418"/>
      <path d="M72 18 L74 24 L80 26 L74 28 L72 34 L70 28 L64 26 L70 24 Z M24 64 L26 69 L31 71 L26 73 L24 78 L22 73 L17 71 L22 69 Z"
            fill="#fff" stroke="#24150f" stroke-width="2.5"/>
    </g>

    <!-- Focused: four chevrons closing on a point. -->
    <g transform="translate(960 0)">
      <circle cx="48" cy="48" r="42" fill="#7b3fa8"/>
      <use href="#rim"/>
      <g fill="none" stroke="#24150f" stroke-width="13">
        <path d="M36 18 L48 30 L60 18 M36 78 L48 66 L60 78 M18 36 L30 48 L18 60 M78 36 L66 48 L78 60"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="6">
        <path d="M36 18 L48 30 L60 18 M36 78 L48 66 L60 78 M18 36 L30 48 L18 60 M78 36 L66 48 L78 60"/>
      </g>
      <circle cx="48" cy="48" r="8" fill="#fff" stroke="#24150f" stroke-width="3"/>
    </g>

    <!-- Warded: a dome of light over the ground, a spark under it. -->
    <g transform="translate(1056 0)">
      <circle cx="48" cy="48" r="42" fill="#2a8f9f"/>
      <use href="#rim"/>
      <path d="M18 72 C18 44 31 24 48 24 C65 24 78 44 78 72" fill="none" stroke="#24150f" stroke-width="13"/>
      <path d="M18 72 C18 44 31 24 48 24 C65 24 78 44 78 72" fill="none" stroke="#fff" stroke-width="6"/>
      <path d="M14 74 H82" fill="none" stroke="#24150f" stroke-width="10"/>
      <path d="M14 74 H82" fill="none" stroke="#fff" stroke-width="4"/>
      <path d="M48 40 L52 53 L64 57 L52 61 L48 72 L44 61 L32 57 L44 53 Z"
            fill="#fff" stroke="#24150f" stroke-width="3"/>
    </g>

    <!-- On watch (overwatch or guard): an open eye. -->
    <g transform="translate(1152 0)">
      <circle cx="48" cy="48" r="42" fill="#3c4f9a"/>
      <use href="#rim"/>
      <path d="M16 48 C26 31 37 25 48 25 C59 25 70 31 80 48 C70 65 59 71 48 71 C37 71 26 65 16 48 Z"
            fill="#fff" stroke="#24150f" stroke-width="4"/>
      <circle cx="48" cy="48" r="13" fill="#3c4f9a" stroke="#24150f" stroke-width="4"/>
      <circle cx="48" cy="48" r="5" fill="#24150f"/>
    </g>
  </g>
</svg>
